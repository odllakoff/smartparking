services:
  business:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartparking
      POSTGRES_PASSWORD: local_business
      POSTGRES_DB: smartparking
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["business-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartparking -d smartparking"]
      interval: 3s
      timeout: 3s
      retries: 20
  identity:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: local_identity
      POSTGRES_DB: identity
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["identity-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  business-data:
  identity-data:
